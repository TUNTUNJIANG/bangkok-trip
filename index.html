tabBar.addEventListener('click',e=>{const b=e.target.closest('.tb');if(!b)return;selectTab(+b.dataset.idx)});

const page=document.getElementById('page');
function selectTab(idx){
  const nextIdx=Math.max(0,Math.min(TABS.length-1,idx));
  currentIdx=nextIdx;
  tabBar.querySelectorAll('.tb').forEach((button,i)=>button.classList.toggle('active',i===nextIdx));
  const activeTab=tabBar.querySelector(`.tb[data-idx="${nextIdx}"]`);
  if(activeTab)activeTab.scrollIntoView({behavior:'smooth',block:'nearest',inline:'center'});
  render(nextIdx);
}

let swipePointerId=null,swipeStartX=0,swipeStartY=0,swipeStartTarget=null;
const SWIPE_THRESHOLD=50;
function isInteractiveTarget(target){
  return target instanceof Element && target.closest('button,a,input,textarea,select,[onclick],[contenteditable="true"]');
}
function resetSwipe(){
  swipePointerId=null;swipeStartTarget=null;page.classList.remove('swipe-dragging');
}
page.addEventListener('pointerdown',e=>{
  if(e.pointerType==='mouse'&&e.button!==0)return;
  if(isInteractiveTarget(e.target))return;
  swipePointerId=e.pointerId;swipeStartX=e.clientX;swipeStartY=e.clientY;swipeStartTarget=e.target;
  page.classList.add('swipe-dragging');
  page.setPointerCapture?.(e.pointerId);
});
page.addEventListener('pointerup',e=>{
  if(e.pointerId!==swipePointerId)return;
  const dx=e.clientX-swipeStartX,dy=e.clientY-swipeStartY;
  const isHorizontal=Math.abs(dx)>Math.abs(dy)*1.2;
  const isSwipe=isHorizontal&&Math.abs(dx)>=SWIPE_THRESHOLD&&!isInteractiveTarget(swipeStartTarget);
  if(isSwipe)selectTab(currentIdx+(dx<0?1:-1));
  resetSwipe();
});
page.addEventListener('pointercancel',resetSwipe);
page.addEventListener('lostpointercapture',resetSwipe);

  </div>`;

function findNextEvent(){
  const events=[],now=NOW();
  for(let i=0;i<6;i++){const d=TRIP_DATES[i];for(const l of LOCATIONS[i]){if(!l.need)continue;const t=parseTime(d,l.time);if(t>now)events.push({t,label:`${DAY_LABELS[i]} · ${l.time}`,name:l.name})}}
  const outT=parseTimeCN(FLIGHT_OUT.date,FLIGHT_OUT.time);if(outT>now)events.push({t:outT,label:'出发',name:'宁波飞曼谷 9C7431'});
  const backT=parseTime(FLIGHT_BACK.date,FLIGHT_BACK.time);if(backT>now)events.push({t:backT,label:'返程',name:'曼谷飞宁波 9C7432'});
  events.sort((a,b)=>a.t-b.t);return events.length?events[0]:null;
}

function renderDay(idx){
  const locs=LOCATIONS[idx],color=DAY_COLORS[idx],label=DAY_LABELS[idx],date=DAY_DATES[idx];

  h+=`<div class="day-route-overlay" id="route-${idx}"><svg viewBox="0 0 400 200" xmlns="http://www.w3.org/2000/svg">`;
  const pts=[];for(let i=0;i<locs.length;i++){pts.push({x:30+(i/(locs.length-1||1))*340,y:100+Math.sin(i*0.8)*30+Math.cos(i*1.2)*15})}
  if(pts.length>1){let d=`M${pts[0].x},${pts[0].y}`;for(let i=1;i<pts.length;i++)d+=` Q${(pts[i-1].x+pts[i].x)/2},${(pts[i-1].y+pts[i].y)/2-20} ${pts[i].x},${pts[i].y}`;h+=`<path d="${d}" fill="none" stroke="${color}" stroke-width="2.5" stroke-linecap="round"/>`;pts.forEach((p,i)=>{h+=`<circle cx="${p.x}" cy="${p.y}" r="4" fill="${color}"/><text x="${p.x}" y="${p.y-10}" text-anchor="middle" font-size="9" fill="${color}" font-family="sans-serif">${locs[i].time}</text>`})}
  h+=`</svg></div><div class="day-timeline">`;
  locs.forEach(l=>{const badge=l.need?'<span class="dt-badge need">⚠️需预约</span>':'';const gmapUrl=`https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(l.gmap||l.name+' Bangkok')}`;h+=`<div class="dt-item"><div class="dt-dot" style="background:${color}"></div><div class="dt-card" onclick="window.open('${gmapUrl}','_blank')"><div class="dt-time">${l.time}</div><div class="dt-name">${l.name}${badge}</div><div class="dt-desc">${l.desc}</div>${l.budget?`<span class="dt-budget">${l.budget}</span>`:''}<div class="dt-gmap">🗺️ Google Map 导航</div></div></div>`});
  h+=`</div>`;page.innerHTML=h;
}

async function fetchRestaurants(){
  const apiKey=document.getElementById('gKey').value.trim();
  const radius=parseInt(document.getElementById('gRadius').value)||1000;
  const minRating=parseFloat(document.getElementById('gMinRating').value)||4.0;
  const statusEl=document.getElementById('gStatus');
  const resultsEl=document.getElementById('gResults');
  const lat=window.__gLat,lng=window.__gLng;

  if(!apiKey){statusEl.textContent='⚠️ 请先输入 Google API Key';return}
  statusEl.textContent='⏳ 正在查询...';resultsEl.innerHTML='';

  const url='https://places.googleapis.com/v1/places:searchNearby';
  const headers={'Content-Type':'application/json','X-Goog-Api-Key':apiKey,'X-Goog-FieldMask':'places.displayName,places.rating,places.userRatingCount,places.formattedAddress,places.priceLevel,places.googleMapsUri,places.types'};
  const payload={includedTypes:['restaurant'],excludedTypes:['tourist_attraction','travel_agency'],maxResultCount:15,locationRestriction:{circle:{center:{latitude:lat,longitude:lng},radius:radius}}};

  try{
    const resp=await fetch(url,{method:'POST',headers:headers,body:JSON.stringify(payload)});
    if(!resp.ok){const err=await resp.json().catch(()=>({}));throw new Error(err.error?.message||`HTTP ${resp.status}`)}
    const data=await resp.json();
    const places=data.places||[];
    const filtered=places.filter(p=>(p.rating||0)>=minRating);
    if(!filtered.length){statusEl.textContent=`✅ 查询完成, 但未找到评分 ≥ ${minRating} 的餐厅`;return}
    statusEl.textContent=`✅ 找到 ${filtered.length} 家餐厅 (半径${radius}m, 最低${minRating}分)`;
    let h='';
    filtered.sort((a,b)=>(b.rating||0)-(a.rating||0));
    filtered.forEach((p)=>{
      const name=p.displayName?.text||'未知';
      const rating=p.rating||0;
      const count=p.userRatingCount||0;
      const addr=p.formattedAddress||'';
      const price=['','💰','💰💰','💰💰','💰💰💰💰'][p.priceLevel||0]||'';
      const gmap=p.googleMapsUri||'';
      const isThai=p.types?.includes('thai_restaurant');
      h+=`<div style="background:var(--card);border-radius:10px;padding:10px 12px;margin-bottom:8px;box-shadow:0 1px 4px rgba(0,0,0,.04)">
        <div style="display:flex;justify-content:space-between;align-items:start">
          <div style="flex:1">
            <span style="font-size:13px;font-weight:600">${name}</span>
            ${isThai?'<span style="font-size:10px;background:#fef3cd;color:#b8860b;padding:1px 5px;border-radius:3px;margin-left:6px;font-weight:600">泰国菜</span>':''}
            ${price}
          </div>
          <div style="font-size:12px;color:var(--orange);font-weight:700;white-space:nowrap">⭐ ${rating} (${count})</div>
        </div>
        <div style="font-size:11px;color:var(--sub);margin-top:4px">📍 ${addr}</div>
        ${gmap?`<a href="${gmap}" target="_blank" rel="noopener" style="display:inline-block;margin-top:6px;font-size:11px;color:var(--blue);text-decoration:none;padding:3px 8px;background:#e8f4fd;border-radius:6px;font-weight:600">🗺️ Google Map</a>`:''}
      </div>`;
    });
    resultsEl.innerHTML=h;
  }catch(e){statusEl.textContent=` ${e.message}`;console.error(e)}
}
